<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブックマーク設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <img src="icons/icon48.png" alt="icon" class="logo">
        <h1>ブックマーク設定</h1>
      </div>
      <p class="subtitle">ブックマーククリック時の動作を制御します</p>
    </header>

    <section class="section">
      <div class="setting-item">
        <label for="enable-toggle">機能の有効化</label>
        <input type="checkbox" id="enable-toggle" checked>
      </div>

      <div class="setting-item">
        <label for="bg-toggle">バックグラウンドで開く</label>
        <input type="checkbox" id="bg-toggle">
      </div>
    </section>

    <section class="section">
      <h2>ブックマーククイック検索</h2>
      <input type="text" id="search-input" placeholder="ブックマークを検索...">
      <div id="bookmark-list" class="bookmark-list"></div>
    </section>

    <footer class="footer">
      <p class="tip">ヒント: Cmd（またはCtrl）を押しながらブックマークをクリックするか、ホイールクリックでも新しいタブで開くことができます。</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
